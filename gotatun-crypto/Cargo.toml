[package]
name = "gotatun-crypto"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "WireGuard® crypto primites"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["vpn", "wireguard"]
categories = ["asynchronous", "network-programming"]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-linux-android"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
aws-lc-rs = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
x25519-dalek = {
  workspace = true,
  features = [
    "reusable_secrets",
    "static_secrets",
  ]
}

[dev-dependencies]
aead.workspace = true
blake2.workspace = true
chacha20poly1305.workspace = true
criterion = { workspace = true, features = ["html_reports"] }
hmac.workspace = true
rand.workspace = true
x25519-dalek = { workspace = true, features = ["getrandom"] }

[features]
# Use the `aws-lc-rs` crate as the AEAD backend. Default. At least
# one of `ring` and `aws-lc-rs` must be enabled; `aws-lc-rs` wins
# if both are.
aws-lc-rs = ["dep:aws-lc-rs"]
# Use the `ring` crate as the AEAD backend. Combine with
# `default-features = false` to avoid also pulling in `aws-lc-rs`,
# which would otherwise be compiled and linked unused.
ring = ["dep:ring"]
