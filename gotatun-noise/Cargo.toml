[package]
name = "gotatun-noise"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Noise protocol implementation for WireGuard cryptographic handshakes and sessions"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["vpn", "wireguard"]
categories = ["cryptography", "network-programming"]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-linux-android"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
aead = { workspace = true }
blake2 = { workspace = true }
bytes = { workspace = true }
chacha20poly1305 = { workspace = true }
constant_time_eq = { workspace = true }
gotatun-crypto.workspace = true
gotatun-packet.workspace = true
hmac = { workspace = true }
mock_instant = { workspace = true, optional = true }
parking_lot = { workspace = true }
rand = { workspace = true }
rand_core.workspace = true
tracing = { workspace = true }
x25519-dalek = {
  workspace = true,
  features = [
    "reusable_secrets",
    "static_secrets",
  ]
}
zerocopy = { workspace = true, features = ["derive", "std"] }

[dev-dependencies]
etherparse = { workspace = true }
x25519-dalek = { workspace = true, features = ["getrandom"] }

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = { workspace = true }

[target."cfg(unix)".dependencies]
nix = {
  workspace = true,
  default-features = false,
  features = [
    "fs",
    "net",
    "socket",
    "time",
    "uio",
    "user",
  ]
}
